# fshare-autoreconnect sample configuration
# Copy to sharecred.ini and fill in real values. sharecred.ini is git-ignored.
#
# The installer writes this file for you; you only need to edit it by hand if
# you change the shared-folder account or map a different drive letter.
#
# host     = computer name of the SMB server            (required)
# ip       = server IPv4, preferred when present        (optional)
# share    = share name on the server                   (required)
# user     = account that may access the share          (required)
# pass     = its password                               (required)
# domain   = domain for the account; blank = use host   (optional)
# drive    = letter to keep mapped, e.g. Z              (optional)

host=SERVERNAME
ip=
share=FShare
user=
pass=
domain=
drive=
